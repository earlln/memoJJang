name: release

# 태그를 직접 밀 수 없는 환경에서도 릴리스를 만들 수 있도록
# 수동 실행(workflow_dispatch)으로 태그 + 릴리스 + 실행 파일 첨부를 한 번에 처리한다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v1.2.0)"
        required: true
        default: "v1.2.0"
      prerelease:
        description: "사전 릴리스로 표시"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows)
    runs-on: windows-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: .NET 8 SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 게시 (독립 실행 - 런타임 설치 불필요)
        run: >
          dotnet publish src/MemoJJang/MemoJJang.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out/self-contained

      - name: 게시 (프레임워크 의존 - .NET 8 데스크톱 런타임 필요)
        run: >
          dotnet publish src/MemoJJang/MemoJJang.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o out/framework-dependent

      - name: 배포 파일 이름 정리
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/self-contained/MemoJJang.exe      "dist/MemoJJang-$tag-win-x64.exe"
          Copy-Item out/framework-dependent/MemoJJang.exe "dist/MemoJJang-$tag-win-x64-runtime-required.exe"
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table

      - name: 릴리스 생성 및 실행 파일 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 메모짱 ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            ## 메모짱 ${{ inputs.tag }}

            심플하면서도 세련된 윈도우 메모장. **설치 과정 없이 exe 파일 하나로 실행됩니다.**

            ### 어떤 걸 받아야 하나요?

            | 파일 | 설명 |
            | --- | --- |
            | **`MemoJJang-${{ inputs.tag }}-win-x64.exe`** | **대부분 이걸 받으세요.** .NET 설치가 필요 없습니다. 받아서 더블클릭하면 바로 실행됩니다. |
            | `MemoJJang-${{ inputs.tag }}-win-x64-runtime-required.exe` | 용량이 훨씬 작지만 [.NET 8 데스크톱 런타임](https://dotnet.microsoft.com/download/dotnet/8.0/runtime)이 미리 설치돼 있어야 합니다. |

            요구 사항: Windows 10 (1607) 이상 64비트

            ### 실행 방법

            1. 위 파일을 원하는 폴더에 내려받습니다.
            2. 더블클릭하면 바로 실행됩니다. 설치나 관리자 권한이 필요 없습니다.
            3. 지우고 싶으면 exe 파일만 삭제하면 됩니다.
               (설정과 세션은 `%LocalAppData%\MemoJJang\` 에 저장되므로, 완전히 지우려면 이 폴더도 삭제하세요.)

            > 서명되지 않은 실행 파일이라 처음 실행할 때 Windows SmartScreen 경고가 뜰 수 있습니다.
            > `추가 정보` → `실행`을 누르면 됩니다.

            ### 주요 기능

            - 윈도우 기본 메모장의 기능 일습 (파일·편집·서식·보기, 찾기/바꾸기, 줄 이동, 인쇄, 시간/날짜 `F5`)
            - 탭 편집 — 탭마다 실행 취소 기록과 캐럿 위치를 따로 유지
            - 라이트 / 다크 / 시스템 테마
            - 종료 시 저장하지 않은 내용까지 보존하는 세션 유지
            - 정밀한 인코딩 관리 — 자동 감지(BOM · UTF-8 검증 · CP949 폴백), BOM 유무 분리,
              다른 인코딩으로 다시 열기, 저장 전 손실 검사, CRLF/LF/CR 줄 바꿈 변환

            자세한 변경 내역은 [CHANGELOG.md](https://github.com/earlln/memoJJang/blob/main/CHANGELOG.md),
            인코딩 규칙은 [docs/ENCODING.md](https://github.com/earlln/memoJJang/blob/main/docs/ENCODING.md) 를 참고하세요.
